name: Bug report
description: Report a reproducible Hostpin problem
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Do not include passwords, PINs, Agent tokens, API keys, private URLs, databases, or backup files. Report security issues privately from the Security tab.
  - type: input
    id: version
    attributes:
      label: Hostpin version
      description: Output of `hostpin-server version` or `hostpin-agent version`.
      placeholder: v0.1.0
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Server / API
        - Agent / collector
        - Installer / service
        - Dashboard
        - Database / migration
        - Alerts / notifications
        - Themes / compatibility
        - Backup / restore
        - Other
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, architecture, database backend, browser, and deployment method as applicable.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Provide the smallest repeatable sequence with secrets removed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and sanitized logs
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I removed credentials, private addresses, and personal data.
          required: true
        - label: This is not a vulnerability report.
          required: true
