services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: hostpin
      POSTGRES_USER: hostpin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hostpin -d hostpin"]
      interval: 10s
      timeout: 5s
      retries: 10

  hostpin:
    image: ${HOSTPIN_IMAGE:-zhihancn/hostpin:latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      HOSTPIN_PUBLIC_URL: ${HOSTPIN_PUBLIC_URL:-http://localhost:8080}
      HOSTPIN_DATA_DIR: /var/lib/hostpin
      HOSTPIN_DB_DRIVER: postgres
      HOSTPIN_DB_DSN: postgres://hostpin:${POSTGRES_PASSWORD}@postgres:5432/hostpin?sslmode=disable
      HOSTPIN_GEOIP_ENABLED: ${HOSTPIN_GEOIP_ENABLED:-true}
      HOSTPIN_ALLOW_INSECURE_HTTP: ${HOSTPIN_ALLOW_INSECURE_HTTP:-false}
    volumes:
      - hostpin-data:/var/lib/hostpin

volumes:
  hostpin-data:
  postgres-data:
